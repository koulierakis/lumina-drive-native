name: Fix route and GPS status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-route-gps-status.yml
      - .github/scripts/fix_route_gps_status.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply route and GPS status fix
        run: python3 .github/scripts/fix_route_gps_status.py
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Validate web export
        run: npx expo export --platform web
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.web.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(web): keep GPS status stable and preserve route"
          git push origin main
