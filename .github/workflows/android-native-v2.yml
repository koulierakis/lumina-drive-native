name: Android Native Driver V2

on:
  push:
    branches:
      - work/driver-assistant-v2
    paths:
      - 'app/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'eas.json'
      - '.github/workflows/android-native-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Expo Android prebuild
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-drive-v2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
