name: Publish LUMINA Drive Web Final
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publish-lumina-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
