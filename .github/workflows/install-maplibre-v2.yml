name: Install MapLibre V2 Dependency

on:
  push:
    branches: [work/driver-assistant-v2]
    paths:
      - '.github/workflows/install-maplibre-v2.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  install-maplibre:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/driver-assistant-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install MapLibre React Native
        run: npm install --save-exact @maplibre/maplibre-react-native@11.3.10 --no-audit --no-fund
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "MapLibre dependency already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(v2): add MapLibre React Native 11.3.10"
          git push origin HEAD:work/driver-assistant-v2
